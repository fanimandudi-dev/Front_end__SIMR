<div class="h-full flex flex-col space-y-4 animate-fade-in">

    <!-- En-tête -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h2 class="text-2xl font-bold text-slate-800">Carte Épidémiologique</h2>
            <p class="text-slate-500">Visualisation spatiale des clusters détectés par l'IA (DBSCAN)</p>
        </div>

        <!-- STATISTIQUES EN TEMPS RÉEL & BOUTON IA -->
        <div class="flex items-center gap-4">

            <!-- Bloc de statistiques (Signals) -->
            <div class="flex items-center gap-6 bg-white px-5 py-2.5 rounded-xl border shadow-sm text-sm">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
                    <span class="text-slate-600 font-medium">Foyers IA :</span>
                    <span class="font-bold text-lg text-slate-900">{{ nbClusters() }}</span>
                </div>

                <div class="w-px h-6 bg-slate-200"></div>

                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-blue-500"></span>
                    <span class="text-slate-600 font-medium">Bruit (Isolés) :</span>
                    <span class="font-bold text-lg text-slate-900">{{ nbCasIsoles() }}</span>
                </div>
            </div>

            <!-- BOUTON DE LANCEMENT DBSCAN (Identique au Dashboard) -->
            <button (click)="lancerIA()" [disabled]="isAnalyzing()"
                class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-medium transition-all shadow-md shadow-indigo-200 disabled:opacity-70 disabled:cursor-not-allowed">

                @if (isAnalyzing()) {
                <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                <span>Calcul en cours...</span>
                } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                <span>Relancer l'IA</span>
                }
            </button>

        </div>
    </div>

    <!-- Le conteneur de la carte Leaflet -->
    <div class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative z-0">

        <!-- Écran de chargement API -->
        @if (isLoading()) {
        <div class="absolute inset-0 z-50 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center">
            <svg class="animate-spin h-10 w-10 text-indigo-600 mb-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            <p class="text-indigo-600 font-medium animate-pulse">Chargement de la modélisation spatiale...</p>
        </div>
        }

        <div id="map" class="w-full h-full min-h-[500px]"></div>
    </div>

</div>
