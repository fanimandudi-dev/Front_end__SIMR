<div class="max-w-4xl mx-auto h-full flex flex-col items-center justify-center animate-fade-in p-6">

    <div class="text-center mb-12">
        <h2 class="text-3xl font-bold text-slate-800 mb-4">Ajouter un nouveau cas</h2>
        <p class="text-slate-500 max-w-xl mx-auto">Choisissez la méthode de saisie des informations du patient.
            L'utilisation de l'intelligence artificielle (OCR) est recommandée pour les fiches papier SIMR.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full">

        <!-- CARTE : SAISIE MANUELLE -->
        <button (click)="allerVersManuel()"
            class="group relative bg-white p-8 rounded-2xl shadow-sm border border-slate-200 hover:border-secondaire hover:shadow-lg transition-all duration-300 flex flex-col items-center text-center overflow-hidden focus:outline-none focus:ring-4 focus:ring-blue-100">
            <div
                class="absolute inset-0 bg-gradient-to-br from-transparent to-slate-50 opacity-0 group-hover:opacity-100 transition-opacity">
            </div>

            <div
                class="w-20 h-20 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 group-hover:bg-blue-50 group-hover:text-secondaire transition-all duration-300">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
            </div>

            <h3 class="text-xl font-bold text-slate-800 mb-2 relative z-10">Formulaire Manuel</h3>
            <p class="text-sm text-slate-500 relative z-10">Saisie classique au clavier des données démographiques et
                cliniques du patient.</p>
        </button>

        <!-- CARTE : NUMÉRISATION OCR -->
        <button (click)="allerVersOCR()"
            class="group relative bg-white p-8 rounded-2xl shadow-sm border border-slate-200 hover:border-secondaire hover:shadow-lg transition-all duration-300 flex flex-col items-center text-center overflow-hidden focus:outline-none focus:ring-4 focus:ring-blue-100">
            <!-- Badge "Recommandé" -->
            <span
                class="absolute top-4 right-4 bg-green-100 text-green-700 text-xs font-bold px-3 py-1 rounded-full shadow-sm z-20">Recommandé
                (IA)</span>

            <div
                class="absolute inset-0 bg-gradient-to-br from-transparent to-blue-50 opacity-0 group-hover:opacity-100 transition-opacity">
            </div>

            <div
                class="w-20 h-20 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 group-hover:bg-blue-50 group-hover:text-secondaire transition-all duration-300">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </div>

            <h3 class="text-xl font-bold text-slate-800 mb-2 relative z-10">Numérisation Fiche SIMR</h3>
            <p class="text-sm text-slate-500 relative z-10">Prenez en photo une fiche papier. Notre Intelligence
                Artificielle lira le texte à votre place.</p>
        </button>

    </div>
</div>
