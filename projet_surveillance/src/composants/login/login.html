<!-- C'est l'écran de Login qui prend toute la page -->
<div class="min-h-screen bg-slate-100 flex flex-col justify-center items-center p-4 font-sans">
  
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden animate-fade-in">
    <!-- Header Design -->
    <div class="bg-primaire p-8 text-center text-white">
      <h1 class="text-3xl font-bold tracking-wider mb-2">SIMR <span class="text-secondaire">App</span></h1>
      <p class="text-slate-300 text-sm">Système Intégré de Surveillance de la Maladie et de la Riposte</p>
    </div>

    <!-- Formulaire -->
    <div class="p-8">
      <h2 class="text-xl font-bold text-slate-800 mb-6 text-center">Connexion à votre espace</h2>

      <!-- Message d'erreur -->
      @if (errorMessage()) {
        <div class="bg-red-50 border border-red-200 text-red-700 p-3 text-sm mb-6 rounded flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          {{ errorMessage() }}
        </div>
      }

      <form (ngSubmit)="seConnecter()" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Identifiant</label>
          <input type="text" [(ngModel)]="credentials.login" name="login" required placeholder="Ex: admin"
                 class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-secondaire focus:outline-none transition-shadow">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
          <input type="password" [(ngModel)]="credentials.mdp" name="mdp" required placeholder="••••••••"
                 class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-secondaire focus:outline-none transition-shadow">
        </div>

        <button type="submit" [disabled]="isLoading() || !credentials.login || !credentials.mdp" 
                class="w-full bg-secondaire text-white py-3 rounded-lg font-bold shadow-md hover:bg-blue-600 transition-colors mt-4 flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
          @if (isLoading()) {
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Connexion en cours...
          } @else {
            Se connecter
          }
        </button>
      </form>
    </div>
  </div>
</div>
